# ============================================================================
# 任务三 · 电机驱动演示启动配置（双环角度闭环）
# 启动：ros2 launch rmcs_bringup rmcs.launch.py robot:=test
# 数据流：
#   ros2 topic pub /motor_demo/angle_cmd <rad> → AngleTargetController
#      → 优弧误差 /motor_demo/angle_error
#      → 外环 ErrorPidController(角度) → /motor_demo/target_velocity
#      → 内环 PidController(速度) → /motor_demo/motor/control_torque → 电机
#   （任务二摇杆版在下方注释保留）
# ============================================================================
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      # 硬件层：跟电机/遥控说话（test.cpp）
      - rmcs_core::hardware::MotorTest -> motor_test_hardware

      # 角度指令桥(任务三)：订阅外部 /motor_demo/angle_cmd → 输出优弧角度误差
      - rmcs_core::controller::motor_demo::AngleTargetController -> motor_angle_target
      # - rmcs_core::controller::motor_demo::JoystickVelocityMapping -> motor_joystick_mapping  # (任务二摇杆备用)

      # 测速低通滤波（内环测量前置）
      - rmcs_core::controller::motor_demo::VelocityFilter -> motor_velocity_filter

      # 外环(角度环)：复用仓库 ErrorPidController —— 角度误差 → 目标速度
      - rmcs_core::controller::pid::ErrorPidController -> motor_angle_pid_controller

      # 内环(速度环)：复用仓库 PidController —— 速度误差 → 扭矩
      - rmcs_core::controller::pid::PidController -> motor_speed_pid_controller

      # 观测：把内部 double 转发成真实 ROS2 话题（Foxglove / ros2 topic echo 可见）
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

motor_test_hardware:
  ros__parameters:
    # CBoard 的 USB 序列号（lsusb -v 看到的 iSerial），不是路径！
    board_serial: "D4-6A83-030D-F3D0-9103-F8A5-1246"

# motor_joystick_mapping:     # （任务二摇杆版，停用）
#   ros__parameters:
#     max_velocity: 3.0

motor_angle_pid_controller:   # 外环：角度误差(rad) → 目标速度(rad/s)
  ros__parameters:
    measurement: /motor_demo/angle_error
    control:     /motor_demo/target_velocity
    kp: 2.0           # 角度→速度增益：先保守；抖就降、到位太慢就升
    ki: 0.0
    kd: 0.0
    output_min: -5.0  # 目标速度上限(rad/s)，别让电机飞
    output_max: 5.0
    integral_min: 0.0
    integral_max: 0.0

motor_velocity_filter:
  ros__parameters:
    cutoff_frequency: 10.0      # 滤波截止(Hz)：20 时毛刺多("拉")→降到 10 更平滑；还拉就再降(8/6)，太钝则回调并降kp
    sampling_frequency: 1000.0  # 必须等于 update_rate

motor_speed_pid_controller:
  ros__parameters:
    measurement: /motor_demo/motor/velocity_filtered   # 反馈：滤波后测速(rad/s)
    setpoint:    /motor_demo/target_velocity           # 目标：摇杆映射出的速度
    control:     /motor_demo/motor/control_torque      # 输出：扭矩(N·m)给电机
    kp: 0.4            # P：误差→力（太小推不动）
    ki: 0.1            # I：消静摩擦/残余误差，到位靠它
    kd: 0.0            # D：测速有噪声先不加
    output_min: -1.0   # 扭矩限幅 N·m
    output_max: 1.0
    integral_min: -0.5  # ★积分限幅要放开，否则 ki 不生效(被夹到0)
    integral_max: 0.5

value_broadcaster:
  ros__parameters:
    forward_list: [
      "/motor_demo/target_velocity",         # 外环输出=内环目标速度
      "/motor_demo/target_angle",            # ★目标角度(与 angle 叠图比对)
      "/motor_demo/angle_error",             # 角度误差(优弧卷绕后)
      "/motor_demo/motor/angle",             # 当前角度(多圈连续)
      "/motor_demo/motor/velocity",          # 原始测速
      "/motor_demo/motor/torque",            # 原始扭矩
      "/motor_demo/motor/max_torque",        # 电机扭矩上限
      "/motor_demo/motor/velocity_filtered", # 滤波后测速
      "/motor_demo/motor/control_torque",    # 给电机的扭矩
    ]
