# ============================================================================
# RMCS 电机演示 —— 外环/内环各成独立 PID 块，测试切换只动 components 两行
#   启动：ros2 launch rmcs_bringup rmcs.launch.py robot:=test
#
# ═══════ 三套测试方案（目标速度只允许一个源在写）═══════
# 【A·角度】(默认开)：
#   AngleTargetController(角度源：方波/外部 angle_cmd)
#      → motor_angle_pid_controller(★外环PID, 独立块) → 内环
#   Foxglove 看 angle 追 target_angle；调外环块 kp/ki
# 【B·速度·yaml 波形】(免遥控)：
#   components 注释掉 A 两行、放开 CommandMode 那行
#   → 用 motor_command_mode 段(速度固定/方波/正弦)；调 motor_speed_pid_controller
# 【C·速度·遥控】(DR16 摇杆, ★需接遥控器)：
#   components 放开 JoystickVelocityMapping 那行、注释 A 两行 + B 行
#   → 推左摇杆 y → 目标速度；摇杆未连接/断连时输出 0(安全)
#   ⚠️ 目前没有遥控器 → C 默认注释，别开 C(没遥控 = 目标恒 0 电机不动)
#   （其余组件 + value_broadcaster 都不用动）
# ============================================================================
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      - rmcs_core::hardware::MotorTest -> motor_test_hardware

      # ═══ 方案A·角度(默认开)：角度源 + 外环PID(锁角/angle_cmd/角度方波) ═══
      - rmcs_core::controller::motor_demo::AngleTargetController -> motor_angle_target
      - rmcs_core::controller::pid::ErrorPidController -> motor_angle_pid_controller
      # ═══ 方案B·速度(yaml 波形)：放开这行 + 注释上面 A 两行 ═══
      # - rmcs_core::controller::motor_demo::CommandModeController -> motor_command_mode
      # ═══ 方案C·速度(遥控 DR16 摇杆, ★需接遥控器)：放开这行 + 注释 A 两行 + B 行 ═══
      # - rmcs_core::controller::motor_demo::JoystickVelocityMapping -> motor_joystick_mapping

      - rmcs_core::controller::motor_demo::VelocityFilter -> motor_velocity_filter
      - rmcs_core::controller::pid::PidController -> motor_speed_pid_controller   # 内环
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

motor_test_hardware:
  ros__parameters:
    # CBoard 的 USB 序列号（lsusb -v 看到的 iSerial），不是路径！
    board_serial: "D4-6A83-030D-F3D0-9103-F8A5-1246"

# —— 角度源(方案A·当前默认)：锁定/外部 angle_cmd / 角度方波 ——
motor_angle_target:
  ros__parameters:
    angle_waveform: none            # none=锁定当前角, 听外部 /motor_demo/angle_cmd | square=角度方波
    angle_square_low: 0.5           # 角度方波低位角(rad)
    angle_square_high: 1.5          # 角度方波高位角(rad)
    angle_square_half_period_s: 5.0
    angle_square_cycles: 0          # 0=一直跑；>0 跑满后锁当前角

# ★外环(角度环)PID：调角度环就改这里 (启用时需放开上面组件行)
motor_angle_pid_controller:
  ros__parameters:
    measurement: /motor_demo/angle_error   # 吃角度源算好的优弧误差
    control:     /motor_demo/target_velocity
    kp: 2.0                    # 超调↓、太慢↑
    ki: 0.2                    # 消静态残差(0→0.2)：上面实测对比过
    kd: 0.0
    output_min: -5.0
    output_max: 5.0
    integral_min: -1.0
    integral_max: 1.0

# —— 速度源(方案B用)：固定/方波/正弦（切B时放开上面组件行）——
motor_command_mode:
  ros__parameters:
    mode: velocity              # angle 已由外环承接，B 只用 velocity；torque 需再注释内环PID那行
    velocity: 2.0               # 固定目标速度(rad/s)(velocity_waveform=none 时)
    velocity_waveform: none    # none | square | sine
    waveform_amplitude: 1.5     # 方波±幅值 / 正弦幅值(rad/s)
    waveform_frequency_hz: 0.2  # 频率Hz：方波半周期=0.5/f，正弦周期=1/f
    waveform_cycles: 0

# —— 速度源·遥控(方案C·DR16 摇杆, ★需接遥控器)：左摇杆 y → 目标速度 ——
motor_joystick_mapping:
  ros__parameters:
    max_velocity: 3.0   # 摇杆满量程对应最大速度(rad/s)

motor_velocity_filter:
  ros__parameters:
    median_window: 5          # 中值窗口(奇数)：砍测速尖刺
    cutoff_frequency: 10.0    # 低通截止(Hz)
    sampling_frequency: 1000.0

motor_speed_pid_controller:   # 内环(速度环)：目标速度 → 扭矩
  ros__parameters:
    measurement: /motor_demo/motor/velocity_filtered   # 反馈(中值+低通后)
    setpoint:    /motor_demo/target_velocity           # 目标速度(A:外环出 / B:速度源)
    control:     /motor_demo/motor/control_torque      # 输出扭矩给电机
    kp: 0.4            # 太小慢、太大会抖/超调
    ki: 0.1            # 消稳速残差
    kd: 0.0
    output_min: -1.0
    output_max: 1.0
    integral_min: -0.5
    integral_max: 0.5

value_broadcaster:
  ros__parameters:
    forward_list: [
      "/motor_demo/target_velocity",
      "/motor_demo/target_angle",
      "/motor_demo/angle_error",
      "/motor_demo/motor/angle",
      "/motor_demo/motor/velocity",
      "/motor_demo/motor/torque",
      "/motor_demo/motor/max_torque",
      "/motor_demo/motor/velocity_filtered",
      "/motor_demo/motor/control_torque",
    ]


