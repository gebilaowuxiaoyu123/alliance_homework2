# ============================================================================
# 电机驱动演示 test.yaml —— 分两个"调试档"，串级整定：先内环后外环
#   启动：ros2 launch rmcs_bringup rmcs.launch.py robot:=test
#
# ═════════════ 整定流程（先内环后外环）═════════════
# ① 档1【只内环·调速度】(当前开)：
#      外环停用，CommandModeController(velocity 方波) 直接给目标速度
#      → Foxglove 看 target_velocity(方波) vs velocity_filtered(响应)
#      → 调 内环 kp/ki，直到 velocity_filtered 上升快、不超调、稳稳跟平
# ② 内环满意后 → 切档2【整机双环·调角度】：
#      把 components 里 档2 两行取消注释、档1 那行注释；参数也换
#      → 发 angle_cmd 看 target_angle vs angle，调 外环 kp / angle 上限
#
# ═══ 怎么切档 ═══
# 档1→档2: components 注释掉 CommandModeController 那行；放开 AngleTarget+ErrorPid
#          两行；【参数档2·外环】取消注释；broadcaster 里 target_angle/angle_error
#          取消注释。
# 档2→档1: 反向操作 + broadcaster 那两行再注释。
# ============================================================================
rmcs_executor:
  ros__parameters:
    update_rate: 1000.0
    components:
      # —— 硬件层(两档共用) ——
      - rmcs_core::hardware::MotorTest -> motor_test_hardware

      # ===== 档2·整机双环(调角度环)【当前开】=====
      - rmcs_core::controller::motor_demo::AngleTargetController -> motor_angle_target
      - rmcs_core::controller::pid::ErrorPidController -> motor_angle_pid_controller

      # ===== 档1·只内环(调速度环)【注释：想再调速度环时切回】=====
      # - rmcs_core::controller::motor_demo::CommandModeController -> motor_command_mode

      # —— 测速滤波(中值+低通；共用) ——
      - rmcs_core::controller::motor_demo::VelocityFilter -> motor_velocity_filter

      # —— 内环速度PID(共用：档1追mode目标/方波；档2追外环目标) ——
      - rmcs_core::controller::pid::PidController -> motor_speed_pid_controller

      # —— 观测转发(共用) ——
      - rmcs_core::broadcaster::ValueBroadcaster -> value_broadcaster

motor_test_hardware:
  ros__parameters:
    # CBoard 的 USB 序列号（lsusb -v 看到的 iSerial），不是路径！
    board_serial: "D4-6A83-030D-F3D0-9103-F8A5-1246"

# ================= 参数·档1：只内环（速度指令源）【切回档1时取消注释】 =================
# motor_command_mode:
#   ros__parameters:
#     mode: velocity               # angle|velocity|torque —— 档1 用 velocity
#     velocity: 1.0                # 目标速度(rad/s)(waveform=none 时)
#     angle: 1.0
#     torque: 0.5
#     angle_kp: 2.0
#     angle_velocity_max: 5.0
#     # ★速度环整定激励：方波(±A)；想恒速改 none
#     velocity_waveform: square
#     waveform_amplitude: 1.0      # 方波幅值(rad/s)
#     waveform_frequency_hz: 0.2   # 频率 → 半周期=0.5/f=2.5s
#     waveform_cycles: 0           # 0=一直跑

# ================= 参数·档2：外环(角度环)【当前开】 =================
motor_angle_pid_controller:    # 外环：角度误差(rad) → 目标速度(rad/s)
  ros__parameters:
    measurement: /motor_demo/angle_error
    control:     /motor_demo/target_velocity
    kp: 2.0                    # 调角度环主要动这个
    ki: 0.0
    kd: 0.0
    output_min: -5.0
    output_max: 5.0
    integral_min: 0.0
    integral_max: 0.0

# ================= 参数·角度方波源(motor_angle_target)【测外环用】 =================
motor_angle_target:
  ros__parameters:
    angle_waveform: square          # none=听外部 angle_cmd | square=内置角度方波
    angle_square_low: 0.5           # 方波低位角(rad)
    angle_square_high: 1.5          # 方波高位角(rad)
    angle_square_half_period_s: 5.0 # 半周期(秒)：5s 在高位、5s 在低位来回
    angle_square_cycles: 0          # 0=一直跑；>0 则跑满后锁当前角

# ================= 参数·共用：速度反馈滤波 + 内环PID =================
motor_velocity_filter:
  ros__parameters:
    median_window: 5          # 中值窗口(奇数)：砍测速尖刺
    cutoff_frequency: 10.0    # 低通截止(Hz)
    sampling_frequency: 1000.0

motor_speed_pid_controller:   # 内环：目标速度 → 扭矩（档1/档2 都是它）
  ros__parameters:
    measurement: /motor_demo/motor/velocity_filtered   # 反馈(中值+低通后)
    setpoint:    /motor_demo/target_velocity           # 档1:mode目标 / 档2:外环输出
    control:     /motor_demo/motor/control_torque      # 输出扭矩给电机
    kp: 0.4           # ★档1整定主要动这个：太小慢、太大会抖/超调
    ki: 0.1           # 消稳速残差
    kd: 0.0
    output_min: -1.0
    output_max: 1.0
    integral_min: -0.5
    integral_max: 0.5

value_broadcaster:
  ros__parameters:
    # 档1(velocity) 只产生这些；切档2(angle) 时把 target_angle/angle_error 放开。
    forward_list: [
      "/motor_demo/target_velocity",         # 目标速度(档2外环输出)
      "/motor_demo/target_angle",            # 目标角度(抬升值,与angle叠图)
      "/motor_demo/angle_error",             # 角度误差(优弧卷绕后)
      "/motor_demo/motor/angle",             # 当前角度(多圈连续)
      "/motor_demo/motor/velocity",          # 原始测速
      "/motor_demo/motor/torque",            # 原始扭矩
      "/motor_demo/motor/max_torque",        # 电机扭矩上限
      "/motor_demo/motor/velocity_filtered", # 中值+低通后测速
      "/motor_demo/motor/control_torque",    # 给电机的扭矩
    ]

